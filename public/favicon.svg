<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Background rounded square gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1025"/>
      <stop offset="100%" stop-color="#0f0a1a"/>
    </linearGradient>
    <!-- Letter U gradient: deep violet → electric indigo -->
    <linearGradient id="uGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b47aff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Clip to rounded square -->
    <clipPath id="roundClip">
      <rect width="32" height="32" rx="7" ry="7"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" ry="7" fill="url(#bg)"/>

  <!-- Subtle inner glow ring -->
  <rect width="32" height="32" rx="7" ry="7" fill="none" stroke="#863bff" stroke-width="0.6" stroke-opacity="0.35"/>

  <!-- Letter "U" — geometric, bold, clean -->
  <g filter="url(#glow)" clip-path="url(#roundClip)">
    <!-- Left stem -->
    <rect x="7.5" y="6.5" width="4.5" height="14" rx="2" fill="url(#uGrad)"/>
    <!-- Right stem -->
    <rect x="20" y="6.5" width="4.5" height="14" rx="2" fill="url(#uGrad)"/>
    <!-- Bottom curve/bar -->
    <rect x="7.5" y="17" width="17" height="4" rx="2" fill="url(#uGrad)"/>
  </g>

  <!-- Champagne-gold accent underline dot -->
  <rect x="13.5" y="25.5" width="5" height="1.5" rx="0.75" fill="#d6b26f" opacity="0.9"/>
</svg>